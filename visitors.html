<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fbf6ef" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Visitor Data | Jassim &amp; Hiba</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" sizes="any" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --bg: #fbf6ef;
      --panel: #fffdf9;
      --text: #2c211b;
      --muted: #78665a;
      --line: rgba(114, 88, 67, 0.16);
      --accent: #724d33;
      --accent-soft: #f4e6da;
      --sage: #8ea28b;
      --sage-soft: #edf3ea;
      --danger: #9f3d33;
      --shadow: 0 18px 48px rgba(122, 91, 67, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Manrope", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(250, 228, 221, 0.72), transparent 34%),
        radial-gradient(circle at bottom right, rgba(237, 243, 234, 0.82), transparent 28%),
        linear-gradient(180deg, #fffdf9 0%, var(--bg) 100%);
    }

    a {
      color: inherit;
    }

    button,
    input {
      font: inherit;
    }

    .shell {
      width: min(1180px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2rem 0 3rem;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.4rem;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .brand-mark {
      width: 2.5rem;
      height: 2.5rem;
      border: 1px solid var(--line);
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--panel);
      font-family: "Fraunces", serif;
      font-size: 1rem;
      letter-spacing: 0;
      box-shadow: 0 8px 22px rgba(114, 88, 67, 0.08);
    }

    .back-link {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.72rem 1rem;
      background: rgba(255, 253, 249, 0.78);
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 1.5rem;
      align-items: end;
      margin-bottom: 1rem;
    }

    h1 {
      font-family: "Fraunces", serif;
      font-size: clamp(2.2rem, 6vw, 4.4rem);
      font-weight: 600;
      line-height: 0.95;
      letter-spacing: 0;
      color: var(--accent);
    }

    .hero p {
      max-width: 46rem;
      margin-top: 0.7rem;
      color: var(--muted);
      line-height: 1.7;
    }

    .actions {
      display: flex;
      gap: 0.7rem;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .button {
      min-height: 2.75rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 1rem;
      background: var(--accent);
      color: #fffdf9;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(114, 77, 51, 0.16);
    }

    .button.secondary {
      background: rgba(255, 253, 249, 0.85);
      color: var(--accent);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.8rem;
      margin: 1.4rem 0;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 1rem;
      background: rgba(255, 253, 249, 0.78);
      box-shadow: 0 10px 26px rgba(122, 91, 67, 0.07);
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .stat strong {
      display: block;
      margin-top: 0.4rem;
      font-size: 1.8rem;
      color: var(--accent);
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 253, 249, 0.82);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem;
      border-bottom: 1px solid var(--line);
    }

    .search {
      width: min(100%, 24rem);
      min-height: 2.75rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 1rem;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    .search:focus {
      border-color: rgba(114, 77, 51, 0.46);
      box-shadow: 0 0 0 3px rgba(244, 230, 218, 0.8);
    }

    .status {
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.6;
    }

    .status.error {
      color: var(--danger);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th,
    td {
      padding: 0.9rem 1rem;
      border-bottom: 1px solid rgba(114, 88, 67, 0.1);
      text-align: left;
      vertical-align: top;
    }

    th {
      background: rgba(244, 230, 218, 0.55);
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    td {
      color: var(--text);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    tbody tr:hover {
      background: rgba(237, 243, 234, 0.48);
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 0.82rem;
      word-break: break-word;
    }

    .muted {
      color: var(--muted);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 1.8rem;
      border-radius: 999px;
      padding: 0.25rem 0.7rem;
      background: var(--sage-soft);
      color: #53664f;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.06em;
    }

    .empty {
      padding: 2rem;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 760px) {
      .topbar,
      .hero,
      .panel-head {
        align-items: stretch;
        grid-template-columns: 1fr;
        flex-direction: column;
      }

      .actions {
        justify-content: stretch;
      }

      .button,
      .back-link,
      .search {
        width: 100%;
      }

      .stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 460px) {
      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="shell">
    <nav class="topbar" aria-label="Visitor data navigation">
      <a class="brand" href="index.html">
        <span class="brand-mark">JH</span>
        <span>Wedding Data</span>
      </a>
      <a class="back-link" href="index.html">Invitation</a>
    </nav>

    <section class="hero">
      <div>
        <h1>Visitor Data</h1>
        <p>Live records saved by the wedding invitation visitor counter.</p>
      </div>
      <div class="actions">
        <button class="button" type="button" id="refreshButton">Refresh</button>
        <button class="button secondary" type="button" id="exportButton">Export CSV</button>
      </div>
    </section>

    <section class="stats" aria-label="Visitor summary">
      <article class="stat">
        <span>Total Visits</span>
        <strong id="totalVisits">0</strong>
      </article>
      <article class="stat">
        <span>Unique Visitors</span>
        <strong id="uniqueVisitors">0</strong>
      </article>
      <article class="stat">
        <span>Unique IPs</span>
        <strong id="uniqueIps">0</strong>
      </article>
      <article class="stat">
        <span>Today</span>
        <strong id="todayVisits">0</strong>
      </article>
    </section>

    <section class="panel" aria-label="Saved visitor records">
      <div class="panel-head">
        <input class="search" id="searchInput" type="search" placeholder="Search visitor, IP, page, or date" />
        <p class="status" id="statusText">Loading visitor data...</p>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Record</th>
              <th>Visitor</th>
              <th>IP Address</th>
              <th>Created</th>
              <th>Page</th>
              <th>Referrer</th>
              <th>Device</th>
              <th>More Data</th>
            </tr>
          </thead>
          <tbody id="visitorRows"></tbody>
        </table>
      </div>
      <div class="empty" id="emptyState" hidden>No visitor records found.</div>
    </section>
  </main>

  <script>
    const apiUrl = "https://tawoostrading.com/api/getKlayanam";
    const rowsEl = document.getElementById("visitorRows");
    const emptyState = document.getElementById("emptyState");
    const statusText = document.getElementById("statusText");
    const searchInput = document.getElementById("searchInput");
    const refreshButton = document.getElementById("refreshButton");
    const exportButton = document.getElementById("exportButton");
    const totalVisits = document.getElementById("totalVisits");
    const uniqueVisitors = document.getElementById("uniqueVisitors");
    const uniqueIps = document.getElementById("uniqueIps");
    const todayVisits = document.getElementById("todayVisits");

    let records = [];

    const escapeHtml = (value) => String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

    const parseJson = (value) => {
      if (!value || typeof value !== "string") {
        return {};
      }

      try {
        return JSON.parse(value);
      } catch (error) {
        return {};
      }
    };

    const normalizeRecord = (record) => {
      const outerJson = parseJson(record.json_text);
      const message = parseJson(outerJson.message);

      return {
        ...record,
        visitorId: outerJson.id || record.request_id || "",
        visitorName: outerJson.name || "",
        rawMessage: outerJson.message || "",
        message,
        searchable: [
          record.id,
          record.request_id,
          record.ip_address,
          record.created_at,
          outerJson.id,
          outerJson.name,
          outerJson.message,
          message.page,
          message.referrer,
          message.userAgent,
          message.browser && message.browser.userAgent,
          message.browser && message.browser.platform,
          message.browser && message.browser.vendor,
          message.browser && message.browser.plugins && message.browser.plugins.plugins,
          message.browser && message.browser.userAgentData && message.browser.userAgentData.model,
          message.browser && message.browser.userAgentData && message.browser.userAgentData.platform,
          message.device && message.device.deviceMemory,
          message.device && message.device.hardwareConcurrency,
          message.device && message.device.maxTouchPoints,
          message.viewport && message.viewport.width,
          message.viewport && message.viewport.height,
          message.connection && message.connection.effectiveType,
          message.language,
          message.timezone,
          typeof message.screen === "string" ? message.screen : JSON.stringify(message.screen || {})
        ].filter(Boolean).join(" ").toLowerCase()
      };
    };

    const formatDate = (value) => {
      if (!value) {
        return "";
      }

      const normalized = value.includes("T") ? value : value.replace(" ", "T");
      const date = new Date(normalized);

      if (Number.isNaN(date.getTime())) {
        return value;
      }

      return date.toLocaleString();
    };

    const isToday = (value) => {
      if (!value) {
        return false;
      }

      const normalized = value.includes("T") ? value : value.replace(" ", "T");
      const date = new Date(normalized);
      const now = new Date();

      return !Number.isNaN(date.getTime())
        && date.getFullYear() === now.getFullYear()
        && date.getMonth() === now.getMonth()
        && date.getDate() === now.getDate();
    };

    const updateStats = (visibleRecords) => {
      totalVisits.textContent = records.length;
      uniqueVisitors.textContent = new Set(records.map((record) => record.visitorId).filter(Boolean)).size;
      uniqueIps.textContent = new Set(records.map((record) => record.ip_address).filter(Boolean)).size;
      todayVisits.textContent = records.filter((record) => isToday(record.created_at)).length;
      statusText.textContent = `${visibleRecords.length} shown`;
      statusText.classList.remove("error");
    };

    const renderRows = () => {
      const query = searchInput.value.trim().toLowerCase();
      const visibleRecords = query
        ? records.filter((record) => record.searchable.includes(query))
        : records;

      rowsEl.innerHTML = visibleRecords.map((record) => {
        const page = record.message.page || "";
        const referrer = record.message.referrer || "direct";
        const browser = record.message.browser || {};
        const deviceData = record.message.device || {};
        const viewport = record.message.viewport || {};
        const screen = record.message.screen || {};
        const connection = record.message.connection || {};
        const preferences = record.message.preferences || {};
        const battery = record.message.battery || {};
        const storage = record.message.storage || {};
        const uaData = browser.userAgentData || {};
        const screenText = typeof screen === "string"
          ? screen
          : [screen.width && `${screen.width}x${screen.height}`, screen.colorDepth && `${screen.colorDepth} bit`].filter(Boolean).join(" | ");
        const device = [
          record.message.language || (record.message.languages || [])[0],
          record.message.timezone,
          screenText,
          viewport.width && `${viewport.width}x${viewport.height} viewport`,
          viewport.devicePixelRatio && `${viewport.devicePixelRatio} DPR`
        ].filter(Boolean).join(" | ");
        const userAgent = browser.userAgent || record.message.userAgent || record.rawMessage || "";
        const moreData = [
          uaData.mobile !== undefined ? `Mobile: ${uaData.mobile ? "yes" : "no"}` : "",
          uaData.platform ? `UA platform: ${uaData.platform}` : "",
          uaData.model ? `Model: ${uaData.model}` : "",
          browser.platform ? `Platform: ${browser.platform}` : "",
          browser.localStorage !== undefined ? `Local storage: ${browser.localStorage ? "yes" : "no"}` : "",
          browser.sessionStorage !== undefined ? `Session storage: ${browser.sessionStorage ? "yes" : "no"}` : "",
          browser.plugins && browser.plugins.plugins ? `Plugins: ${browser.plugins.plugins.length}` : "",
          deviceData.deviceMemory ? `Memory: ${deviceData.deviceMemory} GB` : "",
          deviceData.hardwareConcurrency ? `CPU threads: ${deviceData.hardwareConcurrency}` : "",
          deviceData.maxTouchPoints !== undefined ? `Touch points: ${deviceData.maxTouchPoints}` : "",
          connection.effectiveType ? `Network: ${connection.effectiveType}` : "",
          connection.downlink ? `Downlink: ${connection.downlink} Mbps` : "",
          connection.saveData !== undefined ? `Save data: ${connection.saveData ? "on" : "off"}` : "",
          battery.level !== undefined ? `Battery: ${Math.round(battery.level * 100)}%` : "",
          storage.quota ? `Storage quota: ${Math.round(storage.quota / 1048576)} MB` : "",
          preferences.colorScheme ? `Theme: ${preferences.colorScheme}` : ""
        ].filter(Boolean).join(" | ");

        return `
          <tr>
            <td><span class="badge">#${escapeHtml(record.id)}</span></td>
            <td>
              <strong>${escapeHtml(record.visitorName || "Visitor")}</strong>
              <div class="mono muted">${escapeHtml(record.visitorId)}</div>
            </td>
            <td class="mono">${escapeHtml(record.ip_address || "")}</td>
            <td>${escapeHtml(formatDate(record.created_at))}</td>
            <td class="mono">${escapeHtml(page || "Not saved")}</td>
            <td class="mono">${escapeHtml(referrer)}</td>
            <td>
              <div>${escapeHtml(device || "Not saved")}</div>
              <div class="mono muted">${escapeHtml(userAgent)}</div>
            </td>
            <td class="mono">${escapeHtml(moreData || "Not saved")}</td>
          </tr>
        `;
      }).join("");

      emptyState.hidden = visibleRecords.length > 0;
      updateStats(visibleRecords);
    };

    const loadVisitors = async () => {
      statusText.textContent = "Loading visitor data...";
      statusText.classList.remove("error");
      emptyState.hidden = true;

      try {
        const response = await fetch(apiUrl, { cache: "no-store" });

        if (!response.ok) {
          throw new Error(`Request failed with ${response.status}`);
        }

        const result = await response.json();
        const list = Array.isArray(result) ? result : result.data;

        records = Array.isArray(list)
          ? list.map(normalizeRecord).sort((a, b) => Number(b.id) - Number(a.id))
          : [];

        renderRows();
      } catch (error) {
        records = [];
        rowsEl.innerHTML = "";
        updateStats([]);
        statusText.textContent = "Could not load data. If this page is opened from GitHub Pages, enable CORS on the API for this domain.";
        statusText.classList.add("error");
        emptyState.hidden = false;
      }
    };

    const exportCsv = () => {
      const headers = ["id", "visitor_id", "ip_address", "created_at", "page", "referrer", "language", "timezone", "screen", "viewport", "platform", "mobile", "model", "memory_gb", "cpu_threads", "touch_points", "network", "battery", "user_agent", "json"];
      const lines = records.map((record) => [
        record.id,
        record.visitorId,
        record.ip_address,
        record.created_at,
        record.message.page,
        record.message.referrer,
        record.message.language,
        record.message.timezone,
        typeof record.message.screen === "string" ? record.message.screen : JSON.stringify(record.message.screen || {}),
        JSON.stringify(record.message.viewport || {}),
        (record.message.browser || {}).platform,
        ((record.message.browser || {}).userAgentData || {}).mobile,
        ((record.message.browser || {}).userAgentData || {}).model,
        (record.message.device || {}).deviceMemory,
        (record.message.device || {}).hardwareConcurrency,
        (record.message.device || {}).maxTouchPoints,
        JSON.stringify(record.message.connection || {}),
        JSON.stringify(record.message.battery || {}),
        (record.message.browser || {}).userAgent || record.message.userAgent || record.rawMessage,
        JSON.stringify(record.message)
      ].map((value) => `"${String(value ?? "").replace(/"/g, '""')}"`).join(","));
      const blob = new Blob([[headers.join(","), ...lines].join("\n")], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = "wedding-visitors.csv";
      link.click();
      URL.revokeObjectURL(url);
    };

    searchInput.addEventListener("input", renderRows);
    refreshButton.addEventListener("click", loadVisitors);
    exportButton.addEventListener("click", exportCsv);

    loadVisitors();
  </script>
</body>

</html>
